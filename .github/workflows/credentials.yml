# Releases are now occasional, so an expired secret would only surface on the day a release
# has to go out. This checks every Monday that each credential the pipeline needs still works,
# and fails (GitHub then sends an email) when one does not.
name: Credentials check

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docker-hub:
    name: Docker Hub token
    runs-on: ubuntu-latest
    steps:
      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN || secrets.DOCKER_PASSWORD }}

  release-token:
    name: Release token
    runs-on: ubuntu-latest
    steps:
      - name: Token is valid and not about to expire
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
        run: |
          headers="$(mktemp)"
          status="$(curl -s -o /dev/null -D "$headers" -w '%{http_code}' \
            -H "Authorization: Bearer $RELEASE_TOKEN" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY")"
          if [ "$status" != "200" ]; then
            echo "::error::RELEASE_PLEASE_TOKEN is rejected by GitHub (HTTP $status). Create a new one: CONTRIBUTING.md (Releases)."
            exit 1
          fi
          # Fine-grained tokens announce their expiry date in this header.
          expiry="$(grep -i '^github-authentication-token-expiration:' "$headers" | cut -d' ' -f2- | tr -d '\r' || true)"
          if [ -n "$expiry" ]; then
            days=$(( ($(date -d "$expiry" +%s) - $(date +%s)) / 86400 ))
            echo "RELEASE_PLEASE_TOKEN expires on $expiry ($days days)."
            if [ "$days" -lt 30 ]; then
              echo "::error::RELEASE_PLEASE_TOKEN expires in $days days. Renew it now."
              exit 1
            fi
          fi

  vps:
    name: VPS SSH access
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.2.5
        with:
          host:     ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key:      ${{ secrets.VPS_SSH_KEY_griote || secrets.VPS_SSH_KEY }}
          timeout:  30s
          script:   docker info --format 'Docker {{.ServerVersion}} reachable'
