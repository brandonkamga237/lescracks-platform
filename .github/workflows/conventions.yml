# Enforces the commit rules on every pull request, since a local hook can be skipped.
# PRs are squash-merged: the title becomes the commit on develop/main, so it is checked
# like a commit header, and the description (the squash body) like a commit body.
name: Conventions

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: conventions-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  messages:
    name: Commit messages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Title and body go through env vars, never inlined in the script: a crafted
      # title must not be able to run as shell code.
      - name: PR title is a valid commit header
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          printf '%s\n' "$PR_TITLE" > "$RUNNER_TEMP/title"
          scripts/git/check-commit-msg.sh "$RUNNER_TEMP/title"

      - name: PR description has no forbidden mention
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          printf '%s\n' "$PR_BODY" > "$RUNNER_TEMP/body"
          scripts/git/check-commit-msg.sh --mentions "$RUNNER_TEMP/body"

      - name: Every commit of the PR follows the rules
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          status=0
          for sha in $(git rev-list --no-merges "$BASE_SHA..$HEAD_SHA"); do
            git log -1 --format=%B "$sha" > "$RUNNER_TEMP/msg"
            if ! scripts/git/check-commit-msg.sh "$RUNNER_TEMP/msg"; then
              echo "  in commit $(git log -1 --format='%h %s' "$sha")"
              status=1
            fi
          done
          exit $status
