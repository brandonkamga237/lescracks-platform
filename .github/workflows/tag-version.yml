# Turns what runs in production into a version, when the maintainer decides to.
#
# Run it by hand (Actions > Tag a version > Run workflow) with the version to create. By
# default it tags the commit of the last successful deployment; give a commit to tag another
# one. It creates the vX.Y.Z tag and its GitHub release, with notes generated from the pull
# requests merged since the previous version, and adds the version to that commit's images on
# Docker Hub. Deploying never tags anything: that is deploy.yml's job, and this one's alone.
name: Tag a version
run-name: Tag ${{ inputs.version }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to create, e.g. v1.0.0"
        type: string
        required: true
      commit:
        description: "Commit to tag (empty: the one running in production)"
        type: string
        required: false

permissions:
  contents: write
  actions: read

concurrency:
  group: tag-version
  cancel-in-progress: false

env:
  BACKEND_IMAGE:  brandoniscoding/backend-lescracks
  FRONTEND_IMAGE: brandoniscoding/frontend-lescracks
  VERSION:        ${{ inputs.version }}

jobs:
  tag:
    name: Tag ${{ inputs.version }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Version is new and higher than the last one
        run: |
          if ! [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::'$VERSION' is not a version (vX.Y.Z)."
            exit 1
          fi
          if git rev-parse --verify --quiet "refs/tags/$VERSION" >/dev/null; then
            echo "::error::$VERSION already exists."
            exit 1
          fi
          last=$(git tag --list 'v*.*.*' | sort -V | tail -1)
          if [ -n "$last" ] && [ "$(printf '%s\n%s\n' "$last" "$VERSION" | sort -V | tail -1)" != "$VERSION" ]; then
            echo "::error::$VERSION is not higher than the last version, $last."
            exit 1
          fi

      # deploy.yml names each run after the ref it deployed, so the last successful run says
      # what production is running.
      - name: Find the commit to tag
        id: commit
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED: ${{ inputs.commit }}
        run: |
          ref="$REQUESTED"
          if [ -z "$ref" ]; then
            title=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow deploy.yml --status success --limit 1 --json displayTitle --jq '.[0].displayTitle // empty')
            [ -n "$title" ] || { echo "::error::No successful deployment found: give the commit to tag."; exit 1; }
            ref="${title#Deploy }"
            echo "Production runs $ref (from the run « $title »)."
          fi
          commit=$(git rev-parse --verify --quiet "$ref^{commit}" || git rev-parse --verify --quiet "origin/$ref^{commit}") || {
            echo "::error::'$ref' is not a commit, branch or tag of this repository."
            exit 1
          }
          echo "sha=$commit" >> "$GITHUB_OUTPUT"
          echo "Tagging $commit as $VERSION."

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN || secrets.DOCKER_PASSWORD }}

      # A version deployed later by hand then reuses these images instead of rebuilding them.
      - name: Add the version to the commit's images
        env:
          COMMIT: ${{ steps.commit.outputs.sha }}
        run: |
          source_tag="sha-${COMMIT:0:12}"
          for image in "$BACKEND_IMAGE" "$FRONTEND_IMAGE"; do
            if docker manifest inspect "$image:$source_tag" >/dev/null 2>&1; then
              docker buildx imagetools create --tag "$image:$VERSION" "$image:$source_tag"
            else
              echo "::warning::$image:$source_tag is not on Docker Hub (built before images were tagged by commit): no $VERSION image."
            fi
          done

      - name: Create the tag and its release
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT: ${{ steps.commit.outputs.sha }}
        run: |
          gh release create "$VERSION" --repo "$GITHUB_REPOSITORY" --target "$COMMIT" --title "$VERSION" --generate-notes
          {
            echo "### $VERSION"
            echo ""
            echo "Commit \`$COMMIT\`, release https://github.com/$GITHUB_REPOSITORY/releases/tag/$VERSION"
          } >> "$GITHUB_STEP_SUMMARY"
