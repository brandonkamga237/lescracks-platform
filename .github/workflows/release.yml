# Keeps a release pull request open against main, built from the conventional commits merged
# since the last tag. Merging that PR bumps the version, writes CHANGELOG.md, tags vX.Y.Z and
# publishes the GitHub release.
#
# It runs with a personal token, not GITHUB_TOKEN: a PR or tag created by GITHUB_TOKEN triggers
# no workflow, so the required "Commit messages" check would never run on the release PR, and
# a tag push could never start a deployment.
name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    name: Release PR and tag
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Release token is configured
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
        run: |
          if [ -z "$RELEASE_TOKEN" ]; then
            echo "::error::Secret RELEASE_PLEASE_TOKEN is missing. See CONTRIBUTING.md (Releases)."
            exit 1
          fi

      - uses: googleapis/release-please-action@v5.0.0
        id: release
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
