# Opens a release pull request against main, built from the conventional commits merged since
# the last tag, and lets it merge itself once its checks pass. That merge bumps the version,
# writes CHANGELOG.md, tags vX.Y.Z, publishes the GitHub release, then deploys that version
# (deploy.yml).
#
# It runs with a personal token, not GITHUB_TOKEN: a PR or tag created by GITHUB_TOKEN triggers
# no workflow, so the required "Commit messages" check would never run on the release PR, and
# a tag push could never start a deployment.
name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    name: Release PR and tag
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Release token is configured
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
        run: |
          if [ -z "$RELEASE_TOKEN" ]; then
            echo "::error::Secret RELEASE_PLEASE_TOKEN is missing. See CONTRIBUTING.md (Releases)."
            exit 1
          fi

      - uses: googleapis/release-please-action@v5.0.0
        id: release
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # One merge into main is enough to ship: the release PR merges itself once the checks main
      # requires have passed. The personal token enables it, so the push of that merge runs this
      # workflow again, which tags the version and deploys it.
      - name: Merge the release PR once its checks pass
        if: steps.release.outputs.prs_created == 'true'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          RELEASE_PR: ${{ steps.release.outputs.pr }}
        run: |
          number=$(jq -r '.number' <<< "$RELEASE_PR")
          if [ "$(gh api "repos/$GITHUB_REPOSITORY" --jq .allow_auto_merge)" != "true" ]; then
            echo "::error::Turn on Settings > General > Pull Requests > Allow auto-merge, or merge release PR #$number by hand."
            exit 1
          fi
          gh pr merge "$number" --auto --merge --repo "$GITHUB_REPOSITORY"

  deploy:
    name: Deploy
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    uses: ./.github/workflows/deploy.yml
    with:
      version: ${{ needs.release-please.outputs.tag_name }}
    secrets: inherit
