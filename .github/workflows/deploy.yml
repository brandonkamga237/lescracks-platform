# Deploys a commit to the VPS.
#
#   - Every push to main: the commit just merged goes to production.
#   - By hand (Actions > Deploy > Run workflow): redeploy any commit, branch or tag, for
#     instance an earlier one to roll back. Images already on Docker Hub are reused as they
#     are; missing ones are built from that commit.
#
# Deploying never creates a version: images are tagged with the commit they were built from
# (sha-<12 hex>), and the maintainer decides when what runs in production becomes a version
# (tag-version.yml).
#
# Secrets: DOCKER_USERNAME, DOCKER_TOKEN or DOCKER_PASSWORD, VPS_HOST, VPS_USER,
#          VPS_SSH_KEY or VPS_SSH_KEY_griote
name: Deploy
# tag-version.yml reads the deployed ref from this title to find what runs in production.
run-name: Deploy ${{ inputs.ref || github.sha }}

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: "Commit, branch or tag to deploy (an earlier one rolls back)"
        type: string
        required: true

permissions:
  contents: read

# One deployment at a time, and never cancel one halfway through.
concurrency:
  group: production
  cancel-in-progress: false

env:
  BACKEND_IMAGE:  brandoniscoding/backend-lescracks
  FRONTEND_IMAGE: brandoniscoding/frontend-lescracks
  # A secret rather than a value in this public file: GitHub masks it in the public run logs.
  DEPLOY_PATH:    ${{ secrets.DEPLOY_PATH }}

jobs:
  plan:
    name: Resolve the commit
    runs-on: ubuntu-latest
    outputs:
      commit: ${{ steps.resolve.outputs.commit }}
      image_tag: ${{ steps.resolve.outputs.image_tag }}
      build: ${{ steps.images.outputs.build }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Ref names an existing commit
        id: resolve
        env:
          REF: ${{ inputs.ref || github.sha }}
        run: |
          commit=$(git rev-parse --verify --quiet "$REF^{commit}" || git rev-parse --verify --quiet "origin/$REF^{commit}") || {
            echo "::error::'$REF' is not a commit, branch or tag of this repository."
            exit 1
          }
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "image_tag=sha-${commit:0:12}" >> "$GITHUB_OUTPUT"
          echo "Deploying $REF -> $commit"

      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN || secrets.DOCKER_PASSWORD }}

      - name: Images already on Docker Hub
        id: images
        env:
          IMAGE_TAG: ${{ steps.resolve.outputs.image_tag }}
        run: |
          if docker manifest inspect "$BACKEND_IMAGE:$IMAGE_TAG" >/dev/null 2>&1 &&
             docker manifest inspect "$FRONTEND_IMAGE:$IMAGE_TAG" >/dev/null 2>&1; then
            echo "Images $IMAGE_TAG found: deploying them as they are."
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "Images $IMAGE_TAG missing: building them."
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build ${{ matrix.service }} image
    runs-on: ubuntu-latest
    needs: plan
    if: needs.plan.outputs.build == 'true'
    strategy:
      matrix:
        include:
          - service: backend
            image: brandoniscoding/backend-lescracks
            target: prod
          - service: frontend
            image: brandoniscoding/frontend-lescracks
            target: ''
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.plan.outputs.commit }}

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN || secrets.DOCKER_PASSWORD }}

      # latest only follows main: redeploying an old commit by hand must not move it back.
      - uses: docker/build-push-action@v7
        with:
          context: ./${{ matrix.service }}
          target:  ${{ matrix.target }}
          push:    true
          tags: |
            ${{ matrix.image }}:${{ needs.plan.outputs.image_tag }}
            ${{ github.event_name == 'push' && format('{0}:latest', matrix.image) || '' }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to:   type=gha,scope=${{ matrix.service }},mode=max

  deploy:
    name: Deploy to production
    runs-on: ubuntu-latest
    needs: [plan, build]
    if: |
      always() &&
      needs.plan.result == 'success' &&
      (needs.build.result == 'success' || needs.build.result == 'skipped')
    environment: production
    env:
      VERSION: ${{ needs.plan.outputs.image_tag }}

    steps:
      # The compose file of the deployed commit travels with it, so a rollback also rolls
      # back the stack definition.
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.plan.outputs.commit }}

      - name: Deployment directory is configured
        run: |
          [[ "$DEPLOY_PATH" == /* ]] || {
            echo "::error::Secret DEPLOY_PATH is missing or not an absolute path."
            exit 1
          }

      - name: Compose file is version-aware
        run: |
          grep -q 'IMAGE_TAG' docker-compose.prod.yml || {
            echo "::error::This commit predates versioned images: its compose file always runs :latest."
            exit 1
          }

      - name: Add VPS host key
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Upload docker-compose.prod.yml
        uses: appleboy/scp-action@v1.0.0
        with:
          host:      ${{ secrets.VPS_HOST }}
          username:  ${{ secrets.VPS_USER }}
          key:       ${{ secrets.VPS_SSH_KEY_griote || secrets.VPS_SSH_KEY }}
          source:    "docker-compose.prod.yml"
          target:    "${{ env.DEPLOY_PATH }}/"
          overwrite: true

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.5
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_TOKEN || secrets.DOCKER_PASSWORD }}
        with:
          host:            ${{ secrets.VPS_HOST }}
          username:        ${{ secrets.VPS_USER }}
          key:             ${{ secrets.VPS_SSH_KEY_griote || secrets.VPS_SSH_KEY }}
          envs:            DOCKER_USERNAME,DOCKER_PASSWORD,VERSION
          timeout:         60s
          command_timeout: 20m
          script: |
            set -euo pipefail
            cd ${{ env.DEPLOY_PATH }}

            # Compose reads the image tag from here during this run; it is written to .env only
            # once the new version is up, so a failed deploy leaves .env naming the last good one.
            export IMAGE_TAG="$VERSION"

            echo "══════════════════════════════════════════════════"
            echo "  LesCracks Platform — Deployment $VERSION"
            echo "  Date : $(date '+%Y-%m-%d %H:%M:%S UTC')"
            echo "══════════════════════════════════════════════════"

            # ── 1. Traefik network ────────────────────────────────
            echo ""
            echo "-> [1/4] Checking traefik-public network..."
            docker network inspect traefik-public >/dev/null 2>&1 || \
              docker network create traefik-public

            # ── 2. Docker Hub auth + pull ─────────────────────────
            echo ""
            echo "-> [2/4] Docker Hub authentication + image pull..."
            # The VPS must be logged in to pull the images (its stored creds can
            # expire); authenticate every deploy so the pull never fails on auth.
            echo "$DOCKER_PASSWORD" | docker login -u "$DOCKER_USERNAME" --password-stdin
            docker compose -f docker-compose.prod.yml pull backend frontend

            # ── 3. Start infra + backend ──────────────────────────
            echo ""
            echo "-> [3/4] Starting infra (PostgreSQL, MinIO)..."
            docker compose -f docker-compose.prod.yml up -d --no-recreate postgres minio

            echo "  Attente PostgreSQL..."
            timeout 60 sh -c \
              'until docker compose -f docker-compose.prod.yml exec -T postgres \
                pg_isready -U "$DB_USERNAME" -d "$DB_NAME" >/dev/null 2>&1; \
              do sleep 3; done'

            echo "  Starting backend $VERSION (Spring Boot - may take ~60s)..."
            docker compose -f docker-compose.prod.yml up -d backend --remove-orphans

            echo "  Attente backend healthy (max 5 min)..."
            BACKEND_OK=0
            for i in $(seq 1 30); do
              STATUS=$(docker inspect --format='{{.State.Health.Status}}' lescracks-backend 2>/dev/null || echo "unknown")
              if [ "$STATUS" = "healthy" ]; then
                echo "  Backend healthy (tentative $i — statut Docker: healthy)"
                BACKEND_OK=1
                break
              fi
              echo "  Attempt $i/30 - status: $STATUS, retrying in 10s..."
              sleep 10
            done

            if [ "$BACKEND_OK" -eq 0 ]; then
              echo ""
              echo "══════ ERROR: backend not healthy after 5 min ══════"
              echo "  Last 100 lines of backend logs:"
              echo "──────────────────────────────────────────────────────"
              docker logs --tail=100 lescracks-backend 2>&1 || true
              echo "──────────────────────────────────────────────────────"
              exit 1
            fi

            # ── 4. Frontend ───────────────────────────────────────
            echo ""
            echo "-> [4/4] Deploying frontend $VERSION..."
            docker compose -f docker-compose.prod.yml up -d frontend --remove-orphans

            # ── Remember the running version ──────────────────────
            # A manual `docker compose up` on the VPS then keeps this version instead of :latest.
            if grep -q '^IMAGE_TAG=' .env; then
              sed -i "s/^IMAGE_TAG=.*/IMAGE_TAG=$VERSION/" .env
            else
              printf '\nIMAGE_TAG=%s\n' "$VERSION" >> .env
            fi

            # ── Keycloak session lifetimes ────────────────────────
            # --import-realm skips a realm that already exists, so the realm file alone never
            # reaches production. Applied on every deploy; never fails the deploy.
            echo ""
            echo "-> Keycloak: Google/GitHub sessions last 30 days..."
            docker exec lescracks-keycloak sh -c '
              KCADM=/opt/keycloak/bin/kcadm.sh
              $KCADM config credentials --config /tmp/kcadm.config --server http://localhost:8080 --realm master \
                --user "$KC_BOOTSTRAP_ADMIN_USERNAME" --password "$KC_BOOTSTRAP_ADMIN_PASSWORD" &&
              $KCADM update realms/lescracks --config /tmp/kcadm.config \
                -s ssoSessionIdleTimeout=2592000 -s ssoSessionMaxLifespan=2592000 &&
              $KCADM get realms/lescracks --config /tmp/kcadm.config --fields ssoSessionIdleTimeout,ssoSessionMaxLifespan
            ' || echo "  WARNING: Keycloak sessions not updated (container down or admin credentials changed)"

            # ── Cleanup ───────────────────────────────────────────
            echo ""
            echo "-> Pruning unused images..."
            docker image prune -f --filter "until=24h" 2>/dev/null || true

            # ── Final status ──────────────────────────────────────
            echo ""
            echo "-> Service status:"
            docker compose -f docker-compose.prod.yml ps

            echo ""
            echo "══════════════════════════════════════════════════"
            echo "  $VERSION deployed - $(date '+%H:%M:%S UTC')"
            echo "══════════════════════════════════════════════════"
