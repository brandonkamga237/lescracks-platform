# Nothing here has a default: production refuses to start rather than run on a dev value.
spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5

  jpa:
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          batch_size: 20
        order_inserts: true
        order_updates: true

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI}
          jwk-set-uri: ${KEYCLOAK_JWKS_URI:${KEYCLOAK_ISSUER_URI}/protocol/openid-connect/certs}

# The API surface is not public documentation. Setting these off is what actually removes
# the routes; the old app.swagger.enabled flag was read by nobody.
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

app:
  site:
    url: ${SITE_URL}
  cors:
    allowed-origins: ${CORS_ORIGINS}
  minio:
    url: ${MINIO_ENDPOINT}
    access-key: ${MINIO_ACCESS_KEY}
    secret-key: ${MINIO_SECRET_KEY}
    bucket: ${MINIO_BUCKET}

server:
  compression:
    enabled: true
  # Traefik terminates TLS, so Spring must read X-Forwarded-* to build https:// URLs.
  forward-headers-strategy: native

logging:
  level:
    com.brandonkamga.lescracks: INFO
    org.springframework: WARN
    org.hibernate: WARN
