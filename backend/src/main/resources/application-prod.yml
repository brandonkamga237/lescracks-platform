# Nothing here has a default: production refuses to start rather than run on a dev value.
spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5

  jpa:
    show-sql: false
    hibernate:
      ddl-auto: ${SPRING_DDL_AUTO:validate}
    properties:
      hibernate:
        format_sql: false
        jdbc:
          batch_size: 20
        order_inserts: true
        order_updates: true

  flyway:
    validate-on-migrate: false

  security:
    oauth2:
      resourceserver:
        jwt:
          # Public issuer URI (the one written into each token). Internal JWK set URL
          # defaults to the keycloak container inside the Docker network.
          issuer-uri: ${KEYCLOAK_ISSUER_URI:https://auth.lescracks.com/realms/lescracks}
          jwk-set-uri: ${KEYCLOAK_JWKS_URI:http://lescracks-keycloak:8080/realms/lescracks/protocol/openid-connect/certs}

# The API surface is not public documentation. Setting these off is what actually removes
# the routes; the old app.swagger.enabled flag was read by nobody.
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

app:
  admin:
    bootstrap-username: ${ADMIN_USERNAME:admin}
    bootstrap-password: ${ADMIN_PASSWORD:admin}
  site:
    url: ${SITE_URL}
  cors:
    allowed-origins: ${CORS_ORIGINS}
  minio:
    url: ${MINIO_ENDPOINT}
    access-key: ${MINIO_ACCESS_KEY}
    secret-key: ${MINIO_SECRET_KEY}
    bucket: ${MINIO_BUCKET}

server:
  compression:
    enabled: true
  # Traefik terminates TLS, so Spring must read X-Forwarded-* to build https:// URLs.
  forward-headers-strategy: native

logging:
  level:
    com.brandonkamga.lescracks: INFO
    org.springframework: WARN
    org.hibernate: WARN
  file:
    name: /var/log/lescracks/app.log

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus
      base-path: /actuator
  metrics:
    tags:
      application: lescracks-backend
    enable:
      jvm: true
      process: true
      system: true
      tomcat: true
      http: true
      logback: true
