# Only what differs from application.yaml. Every value there already has a dev default,
# so this file is about visibility, not about wiring.
spring:
  jpa:
    show-sql: true

logging:
  level:
    com.brandonkamga.lescracks: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE

app:
  admin:
    bootstrap-username: ${ADMIN_USERNAME:admin}
    bootstrap-password: ${ADMIN_PASSWORD:admin}
