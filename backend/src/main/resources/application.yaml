spring:
  application:
    name: lescracks
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:lescracks}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  # Flyway owns the schema everywhere; Hibernate only checks the entities still match it.
  # No baseline: the database is created by V1, never adopted from an existing one.
  flyway:
    enabled: true
    locations: classpath:db/migration

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true

  security:
    oauth2:
      resourceserver:
        jwt:
          # Keycloak signs, this verifies. Keys are fetched from the realm, so no secret
          # lives in this file and rotating them needs no deployment.
          #
          # Two URLs, on purpose. issuer-uri is the public address, the one written into
          # every token and the one checked against it. jwk-set-uri is where this process
          # actually fetches the keys, which inside a container is the service name — the
          # public address would not resolve. Setting it also makes the decoder lazy, so
          # the API starts whether or not Keycloak is up yet.
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8081/realms/lescracks}
          jwk-set-uri: ${KEYCLOAK_JWKS_URI:${KEYCLOAK_ISSUER_URI:http://localhost:8081/realms/lescracks}/protocol/openid-connect/certs}

  # Members stay signed in for 30 days without activity. Flyway creates the tables (V21).
  session:
    timeout: 30d
    jdbc:
      initialize-schema: never

  servlet:
    multipart:
      max-file-size: ${MAX_UPLOAD_SIZE:25MB}
      max-request-size: ${MAX_UPLOAD_SIZE:25MB}

  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: ${MAIL_AUTH:false}
      mail.smtp.starttls.enable: ${MAIL_STARTTLS:false}

app:
  # Canonical origin used by the SEO snapshots and the sitemap.
  site:
    url: ${SITE_URL:http://localhost:5173}
  mail:
    from: ${MAIL_FROM:LesCracks <contact@lescracks.com>}

  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173}

  minio:
    url: http://${MINIO_HOST:localhost}:${MINIO_PORT:9000}
    access-key: ${MINIO_ACCESS_KEY:minioadmin}
    secret-key: ${MINIO_SECRET_KEY:minioadmin}
    bucket: ${MINIO_BUCKET:lescracks}

  # Internal address of the Umami container, used by the admin audience stats.
  # Audience endpoints return available=false when any of these is unset.
  umami:
    base-url: ${UMAMI_INTERNAL_URL:}
    website-id: ${UMAMI_WEBSITE_ID:}
    username: ${UMAMI_API_USERNAME:}
    password: ${UMAMI_API_PASSWORD:}

  swagger:
    title: LesCracks API
    version: 1.0.0
    description: API de la plateforme LesCracks — événements, ressources, candidatures et attestations

server:
  port: ${SERVER_PORT:8080}
  servlet:
    session:
      timeout: 30d
      # A persistent cookie: closing the browser no longer ends the session. The server-side
      # timeout still applies; this only caps how long the browser keeps it.
      cookie:
        http-only: true
        same-site: lax
        max-age: 90d

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus
