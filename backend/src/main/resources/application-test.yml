# Placeholder profile. The schema under test still needs deciding: the migrations are
# PostgreSQL DDL with JSONB columns and partial unique indexes, none of which H2 can
# represent, so a green test here would say nothing about the real database.
spring:
  flyway:
    enabled: false

  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8081/realms/lescracks

app:
  cors:
    allowed-origins: http://localhost:5173
  minio:
    url: http://localhost:9000
    access-key: test
    secret-key: test
    bucket: lescracks-test

logging:
  level:
    org.springframework: WARN
    org.hibernate: WARN
