# Integration tests. The datasource is supplied by the Testcontainers base class, so no
# url appears here — the container decides its own port.
spring:
  flyway:
    enabled: true
    locations: classpath:db/migration
    # Each class gets the schema rebuilt from V1, so one test's rows never explain
    # another's result.
    clean-disabled: false

  jpa:
    hibernate:
      # validate, exactly as in production: the entities are checked against the
      # migrations, which is one of the things these tests exist to prove.
      ddl-auto: validate
    show-sql: false

  security:
    oauth2:
      resourceserver:
        jwt:
          # Never contacted: tests inject decoded tokens rather than signed ones.
          issuer-uri: http://localhost:8081/realms/lescracks
          jwk-set-uri: http://localhost:8081/realms/lescracks/protocol/openid-connect/certs

app:
  site:
    url: http://localhost:5173
  cors:
    allowed-origins: http://localhost:5173
  minio:
    url: http://localhost:9000
    access-key: test
    secret-key: test
    bucket: lescracks-test

logging:
  level:
    org.springframework: WARN
    org.hibernate: WARN
    org.testcontainers: WARN
    com.github.dockerjava: WARN
