<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <title>Hors ligne · LesCracks</title>
    <!-- Served by the service worker without the network: no bundle, no font, everything inline. -->
    <style>
      html, body { margin: 0; height: 100%; background: #000; color: #fafafa; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; }
      main { min-height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; padding: 24px; text-align: center; box-sizing: border-box; }
      img { width: 72px; height: 72px; border-radius: 18px; }
      h1 { margin: 8px 0 0; font-size: 22px; font-weight: 600; letter-spacing: -0.02em; }
      p { margin: 0; max-width: 300px; color: rgba(255, 255, 255, 0.6); font-size: 15px; line-height: 1.5; }
      button { margin-top: 8px; height: 48px; padding: 0 28px; border: 0; border-radius: 999px; background: #d4af37; color: #000; font-size: 15px; font-weight: 600; }
    </style>
  </head>
  <body>
    <main>
      <img src="/icon-192.png" alt="" />
      <h1>Pas de connexion</h1>
      <p>LesCracks a besoin d’internet pour charger cette page. Vérifie ton réseau puis réessaie.</p>
      <button type="button" onclick="location.reload()">Réessayer</button>
    </main>
  </body>
</html>
