    <!-- Boot loader: drawn before the bundle arrives, dismissed by main.tsx once React has painted.
         A layered service graph: a signal leaves the entry node and reaches each layer in turn,
         breadth first, the way a request crosses a system. -->
    <style>
      #boot-loader { position: fixed; inset: 0; z-index: 100; display: flex; align-items: center; justify-content: center; background: #000; transition: opacity .4s ease, visibility .4s; }
      #boot-loader.is-done { opacity: 0; visibility: hidden; }
      #boot-loader svg { width: min(300px, 76vw); height: auto; overflow: visible; }
      .boot-edge { stroke: rgba(255,255,255,.16); stroke-width: 1; }
      .boot-mesh { stroke: rgba(255,255,255,.12); stroke-width: 1; stroke-dasharray: 2 4; }
      .boot-signal { stroke: #d4af37; stroke-width: 2.2; stroke-linecap: round; stroke-dasharray: .28 1.5; stroke-dashoffset: .28; animation: boot-signal 2.6s cubic-bezier(.45,0,.55,1) infinite; }
      .boot-node { fill: #141414; stroke: rgba(255,255,255,.4); stroke-width: 1.2; animation: boot-node 2.6s ease-out infinite; }
      .boot-halo { fill: none; stroke: #d4af37; stroke-width: 1; opacity: 0; transform-box: fill-box; transform-origin: center; animation: boot-halo 2.6s ease-out infinite; }
      .s0 { animation-delay: 0.00s; }
      .s1 { animation-delay: 0.50s; }
      .s2 { animation-delay: 1.00s; }
      .n0 { animation-delay: 0.00s; }
      .n1 { animation-delay: 0.42s; }
      .n2 { animation-delay: 0.92s; }
      .n3 { animation-delay: 1.42s; }
      .boot-sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
      /* A signal travels its edge in the first 16.2% of the cycle; the dash sits off the line before and after. */
      @keyframes boot-signal { 0% { stroke-dashoffset: .28; } 16.2%, 100% { stroke-dashoffset: -1; } }
      @keyframes boot-node { 0%, 30% { fill: #d4af37; stroke: #d4af37; } 70%, 100% { fill: #141414; stroke: rgba(255,255,255,.4); } }
      @keyframes boot-halo { 0% { opacity: .6; transform: scale(.5); } 35%, 100% { opacity: 0; transform: scale(1.7); } }
      @media (prefers-reduced-motion: reduce) {
        .boot-signal, .boot-halo { display: none; }
        .boot-node { animation: none; fill: #d4af37; stroke: #d4af37; }
      }
    </style>
    <noscript><style>#boot-loader { display: none; }</style></noscript>
