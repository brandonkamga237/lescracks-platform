    <!-- Boot loader: drawn before the bundle arrives, dismissed by main.tsx once React has painted.
         The dots of « LC » form a graph: a signal runs down the L, crosses the link, then splits
         round the C breadth first, lighting each node it reaches and leaving a fading trail. -->
    <style>
      #boot-loader { position: fixed; inset: 0; z-index: 100; display: flex; align-items: center; justify-content: center; background: #000; transition: opacity .4s ease, visibility .4s; }
      #boot-loader.is-done { opacity: 0; visibility: hidden; }
      #boot-loader svg { width: min(280px, 72vw); height: auto; overflow: visible; }
      .boot-edge { stroke: rgba(255,255,255,.18); stroke-width: 1.2; stroke-linecap: round; }
      .boot-link { stroke: rgba(255,255,255,.14); stroke-width: 1; stroke-dasharray: 2 4; }
      .boot-signal { stroke: #d4af37; stroke-width: 2.4; stroke-linecap: round; stroke-dasharray: .35 1.5; stroke-dashoffset: .35; animation: boot-signal 3.4s cubic-bezier(.45,0,.55,1) infinite; }
      .boot-node { fill: #141414; stroke: rgba(255,255,255,.45); stroke-width: 1.2; animation: boot-node 3.4s ease-out infinite; }
      .boot-halo { fill: none; stroke: #d4af37; stroke-width: 1; opacity: 0; transform-box: fill-box; transform-origin: center; animation: boot-halo 3.4s ease-out infinite; }
      .s0 { animation-delay: 0.00s; }
      .s1 { animation-delay: 0.22s; }
      .s2 { animation-delay: 0.44s; }
      .s3 { animation-delay: 0.66s; }
      .s4 { animation-delay: 0.88s; }
      .s5 { animation-delay: 1.10s; }
      .s6 { animation-delay: 1.32s; }
      .s7 { animation-delay: 1.54s; }
      .s8 { animation-delay: 1.76s; }
      .s9 { animation-delay: 1.98s; }
      .n0 { animation-delay: 0.00s; }
      .n1 { animation-delay: 0.20s; }
      .n2 { animation-delay: 0.42s; }
      .n3 { animation-delay: 0.64s; }
      .n4 { animation-delay: 0.86s; }
      .n5 { animation-delay: 1.08s; }
      .n6 { animation-delay: 1.30s; }
      .n7 { animation-delay: 1.52s; }
      .n8 { animation-delay: 1.74s; }
      .n9 { animation-delay: 1.96s; }
      .n10 { animation-delay: 2.18s; }
      .boot-sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
      /* A signal crosses its edge in the first 5.9% of the cycle; the dash sits off the line before and after. */
      @keyframes boot-signal { 0% { stroke-dashoffset: .35; } 5.9%, 100% { stroke-dashoffset: -1; } }
      @keyframes boot-node { 0%, 32% { fill: #d4af37; stroke: #d4af37; } 62%, 100% { fill: #141414; stroke: rgba(255,255,255,.45); } }
      @keyframes boot-halo { 0% { opacity: .6; transform: scale(.5); } 25%, 100% { opacity: 0; transform: scale(1.8); } }
      @media (prefers-reduced-motion: reduce) {
        .boot-signal, .boot-halo { display: none; }
        .boot-node { animation: none; fill: #d4af37; stroke: #d4af37; }
      }
    </style>
    <noscript><style>#boot-loader { display: none; }</style></noscript>
