# =============================================================================
# LesCracks Platform - Local development stack
# =============================================================================
#
# Production lives in docker-compose.prod.yml (deployed by CI).
# This file is for local development only.
#
# Dependencies only (backend run from the IDE / ./mvnw spring-boot:run):
#   docker compose up -d
#
# Full stack (backend in a container):
#   docker compose --profile app up -d --build
#
# No .env is required: every variable below has a development default.
# A .env at the repo root, if present, overrides them.
# =============================================================================

services:

  # ---------------------------------------------------------------------------
  # PostgreSQL - localhost:5432
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: lescracks-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_USER:     ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB:       ${DB_NAME:-lescracks}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Keycloak keeps its realm in a schema of its own, created on first boot.
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:         ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d ${DB_NAME:-lescracks}"]
      interval:     10s
      timeout:      5s
      retries:      5
      start_period: 10s

  # ---------------------------------------------------------------------------
  # MinIO - API localhost:9000, console localhost:9001 (minioadmin/minioadmin)
  # ---------------------------------------------------------------------------
  minio:
    image: minio/minio:latest
    container_name: lescracks-minio-dev
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER:     ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test:         ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval:     30s
      timeout:      10s
      retries:      3
      start_period: 10s

  # ---------------------------------------------------------------------------
  # Keycloak - localhost:8081, admin console at /admin (admin/admin)
  #
  # Identity lives here, not in the application: passwords, resets, login attempt
  # limits and the Google and GitHub logins are all realm configuration rather than
  # code we would have to keep correct ourselves.
  # ---------------------------------------------------------------------------
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: lescracks-keycloak-dev
    restart: unless-stopped
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      # Its own schema in the same server: one less container to run locally, and the
      # separation that matters is the schema, not the process.
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: ${DB_USERNAME:-postgres}
      KC_DB_PASSWORD: ${DB_PASSWORD:-postgres}
      KC_HTTP_PORT: 8080
      KC_HEALTH_ENABLED: "true"
    ports:
      - "${KEYCLOAK_PORT:-8081}:8080"
    volumes:
      - ./keycloak/realm:/opt/keycloak/data/import:ro
    depends_on:
      postgres:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # Spring Boot backend - localhost:8080, compose profile "app" only
  # ---------------------------------------------------------------------------
  backend:
    profiles: ["app"]
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: dev
    container_name: lescracks-backend-dev
    restart: unless-stopped
    ports:
      - "${SERVER_PORT:-8080}:8080"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DB_HOST:        postgres
      DB_PORT:        5432
      DB_NAME:        ${DB_NAME:-lescracks}
      DB_USERNAME:    ${DB_USERNAME:-postgres}
      DB_PASSWORD:    ${DB_PASSWORD:-postgres}
      MINIO_HOST:     minio
      MINIO_PORT:     9000
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      MINIO_BUCKET:   ${MINIO_BUCKET:-lescracks}
      SITE_URL:       ${SITE_URL:-http://localhost:5173}
      # The browser reaches Keycloak on localhost, this container reaches it by service
      # name. The issuer must stay the browser's address or it will not match the tokens.
      KEYCLOAK_ISSUER_URI: http://localhost:${KEYCLOAK_PORT:-8081}/realms/lescracks
      KEYCLOAK_JWKS_URI:   http://keycloak:8080/realms/lescracks/protocol/openid-connect/certs
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      keycloak:
        condition: service_started

volumes:
  postgres_data:
  minio_data:
