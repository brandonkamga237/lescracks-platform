global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules.yml

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Actuator is bound to the internal management port — public traffic never sees it.
  - job_name: 'lescracks-backend'
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['backend:9090']

  - job_name: 'keycloak'
    metrics_path: /metrics
    static_configs:
      - targets: ['keycloak:9000']

  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres-exporter:9187']
