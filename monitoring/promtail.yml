server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: lescracks-backend
    static_configs:
      - targets:
          - localhost
        labels:
          job: lescracks-backend
          __path__: /var/log/lescracks/*.log
